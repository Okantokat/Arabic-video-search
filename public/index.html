<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Arapça Video Arama</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="page">
    <section class="card hero">
      <span class="badge">Fasih Arapça çalışma aracı</span>
      <h1>Arapça kelimeyi videoda bul</h1>
      <p class="lead">
        YouTube bağlantısını ve aradığınız Arapça kelime ya da kalıbı girin.
        Eşleşen konuşma parçalarını zaman kodlarıyla görün.
      </p>

      <form id="searchForm" class="search-form">
        <label>
          YouTube videosu
          <input
            id="videoInput"
            name="video"
            type="url"
            inputmode="url"
            placeholder="https://www.youtube.com/watch?v=..."
            required
          />
        </label>

        <label>
          Arapça kelime / kalıp
          <input
            id="queryInput"
            name="q"
            type="text"
            dir="rtl"
            lang="ar"
            placeholder="مِنْ هَذَا المُنْطَلَقِ"
            required
          />
        </label>

        <button id="searchButton" type="submit">Videoda ara</button>
      </form>

      <p class="hint">
        Harekeli ve harekesiz yazımlar eşleştirilmeye çalışılır.
      </p>
    </section>

    <section id="status" class="status" aria-live="polite"></section>
    <section id="results" class="results" aria-live="polite"></section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
